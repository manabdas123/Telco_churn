<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .container {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            width: 60%;
            margin: 40px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h2 {
            margin-bottom: 20px;
        }

        input, select {
            width: 90%;
            padding: 8px;
            margin: 5px 0 15px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #5a67d8;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Customer Churn Prediction</h2>

    <form action="/predict" method="post">

        <input type="number" name="tenure" placeholder="Tenure" required>
        <input type="number" step="0.01" name="MonthlyCharges" placeholder="Monthly Charges" required>
        <input type="number" step="0.01" name="TotalCharges" placeholder="Total Charges" required>

        <select name="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <select name="SeniorCitizen">
            <option value="">Senior Citizen</option>
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <select name="Partner">
            <option value="">Partner</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <select name="Dependents">
            <option value="">Dependents</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <select name="PhoneService">
            <option value="">Phone Service</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <select name="MultipleLines">
            <option value="">Multiple Lines</option>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
            <option value="No phone service">No phone service</option>
        </select>

        <select name="InternetService">
            <option value="">Internet Service</option>
            <option value="DSL">DSL</option>
            <option value="Fiber optic">Fiber optic</option>
            <option value="No">No</option>
        </select>

        <select name="OnlineSecurity">
            <option value="">Online Security</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <select name="OnlineBackup">
            <option value="">Online Backup</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <select name="DeviceProtection">
            <option value="">Device Protection</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <select name="TechSupport">
            <option value="">Tech Support</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <select name="StreamingTV">
            <option value="">Streaming TV</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <select name="StreamingMovies">
            <option value="">Streaming Movies</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="No internet service">No internet service</option>
        </select>

        <select name="Contract">
            <option value="">Contract</option>
            <option value="Month-to-month">Month-to-month</option>
            <option value="One year">One year</option>
            <option value="Two year">Two year</option>
        </select>

        <select name="PaperlessBilling">
            <option value="">Paperless Billing</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <select name="PaymentMethod">
            <option value="">Payment Method</option>
            <option value="Electronic check">Electronic check</option>
            <option value="Mailed check">Mailed check</option>
            <option value="Bank transfer (automatic)">Bank transfer</option>
            <option value="Credit card (automatic)">Credit card</option>
        </select>

        <button type="submit">Predict</button>

    </form>

    <div class="result">
        {{ prediction_text }}
    </div>

</div>

</body>
</html>
